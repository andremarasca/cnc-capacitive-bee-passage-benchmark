[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bee-counter-bench"
version = "0.1.0"
description = "Reproducible CNC-bench validation of a directional capacitive bee counter"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
acquisition = [
  "nidaqmx>=1.0,<2",
  "pyserial>=3.5,<4",
]
reporting = ["matplotlib>=3.8,<4"]
test = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]
train = ["torch==2.12.1"]

[project.scripts]
bee-counter-bench = "bee_counter_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bee_counter_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
